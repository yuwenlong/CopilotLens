<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>模型用量</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/i18n/zh.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" data-i18n="nav.home">首页</a>
        <a href="/monthly-total" data-i18n="nav.total">月度总用量</a>
        <a href="/monthly-user" data-i18n="nav.user">用户用量</a>
        <a href="/monthly-model" data-i18n="nav.model">模型用量</a>
        <a class="lang-switch" onclick="toggleLang()">中 | EN</a>
    </nav>
    <div class="container">
        <h1 data-i18n="title.model">模型用量</h1>
        <div class="filter">
            <label data-i18n="common.selectMonth">选择月份：</label>
            <input type="month" id="monthPicker">
        </div>
        <div class="chart-card">
            <div id="barChart" style="width:100%;height:500px;"></div>
        </div>
        <div class="chart-card">
            <div id="pieChart" style="width:100%;height:500px;"></div>
        </div>
    </div>
    <script>
        var barChart, pieChart;

        function toggleLang() {
            var lang = localStorage.getItem('lang') === 'en' ? 'zh' : 'en';
            localStorage.setItem('lang', lang);
            location.reload();
        }
        function applyLang() {
            $('[data-i18n]').each(function() {
                var key = $(this).data('i18n');
                var val = key.split('.').reduce(function(o, k) { return o && o[k]; }, window.i18n);
                if (val) $(this).text(val);
            });
        }

        $(function() {
            if (localStorage.getItem('lang') === 'en') {
                var s = document.createElement('script');
                s.src = '/static/i18n/en.js';
                s.onload = function() { applyLang(); document.title = window.i18n.title.model; };
                document.head.appendChild(s);
            } else {
                document.title = window.i18n.title.model;
            }

            barChart = echarts.init(document.getElementById('barChart'));
            pieChart = echarts.init(document.getElementById('pieChart'));
            $(window).resize(function() { barChart.resize(); pieChart.resize(); });

            var params = new URLSearchParams(window.location.search);
            var month = params.get('month');
            if (month) {
                $('#monthPicker').val(month);
                loadMonthlyModel(month);
            }
            $('#monthPicker').on('change', function() {
                if (this.value) {
                    loadMonthlyModel(this.value);
                    history.replaceState(null, '', '?month=' + this.value);
                }
            });
        });

        function loadMonthlyModel(month) {
            $.get("/api/monthly-model", {month: month}, function(data) {
                var t = window.i18n;
                var modelNames = data.models.map(function(m) { return m.model; });
                var totals = data.models.map(function(m) { return m.total; });

                barChart.setOption({
                    title: { text: month + t.model.chartTitle, left: 'center' },
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(255,255,255,0.95)',
                        borderColor: '#e0e0e0',
                        borderWidth: 1,
                        textStyle: { color: '#333' },
                        formatter: function(params) {
                            var d = params[0];
                            return '<b>' + d.name + '</b><br/>' + t.common.credits + ': <b>' + d.value.toLocaleString(undefined, {minimumFractionDigits:2}) + '</b>';
                        }
                    },
                    grid: { left: 80, right: 30, bottom: 150, top: 60 },
                    xAxis: { type: 'category', data: modelNames, axisLabel: { rotate: 45, fontSize: 11 } },
                    yAxis: { type: 'value', name: t.common.credits },
                    series: [{
                        type: 'bar',
                        data: totals,
                        barWidth: '60%',
                        itemStyle: {
                            borderRadius: [4, 4, 0, 0],
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#f0a04b' },
                                { offset: 1, color: '#e67e22' }
                            ])
                        },
                        emphasis: {
                            itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' }
                        }
                    }]
                }, true);

                pieChart.setOption({
                    title: { text: month + t.model.pieTitle, left: 'center' },
                    tooltip: {
                        trigger: 'item',
                        backgroundColor: 'rgba(255,255,255,0.95)',
                        borderColor: '#e0e0e0',
                        borderWidth: 1,
                        textStyle: { color: '#333' },
                        formatter: '{b}: {c} ({d}%)'
                    },
                    legend: { orient: 'vertical', left: 'left', top: 'middle', type: 'scroll' },
                    series: [{
                        type: 'pie',
                        radius: ['35%', '65%'],
                        center: ['50%', '50%'],
                        data: data.models.map(function(m) { return { name: m.model, value: m.total }; }),
                        label: { formatter: '{b}\n{d}%' },
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 14,
                                shadowColor: 'rgba(0,0,0,0.3)',
                                shadowOffsetX: 0,
                                shadowOffsetY: 4
                            }
                        }
                    }]
                }, true);
            }).fail(function() {
                barChart.clear();
                pieChart.clear();
            });
        }
    </script>
</body>
</html>
