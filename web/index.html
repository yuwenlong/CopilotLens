<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CopilotLens 用量分析系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/i18n/zh.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" data-i18n="nav.home">首页</a>
        <a href="/monthly-total" data-i18n="nav.total">月度总用量</a>
        <a href="/monthly-user" data-i18n="nav.user">用户用量</a>
        <a href="/monthly-model" data-i18n="nav.model">模型用量</a>
        <a class="lang-switch" onclick="toggleLang()">中 | EN</a>
    </nav>
    <div class="container">
        <div class="hero-banner">
            <h1 data-i18n="title.index">CopilotLens 用量分析系统</h1>
            <p class="hero-subtitle" data-i18n="index.subtitle">企业级 AI 用量监控与分析平台</p>
        </div>

        <div class="feature-cards">
            <a href="/monthly-total" class="feature-card card-total">
                <div class="icon">📊</div>
                <h3 data-i18n="index.totalTitle">月度总用量</h3>
                <p data-i18n="index.totalDesc">查看每月 AI Credits 消耗总量，掌握整体用量趋势</p>
                <span class="card-link"><span data-i18n="index.enter">进入</span> →</span>
            </a>
            <a href="/monthly-user" class="feature-card card-user">
                <div class="icon">👥</div>
                <h3 data-i18n="index.userTitle">用户用量</h3>
                <p data-i18n="index.userDesc">按用户维度分析用量，支持明细下钻查看</p>
                <span class="card-link"><span data-i18n="index.enter">进入</span> →</span>
            </a>
            <a href="/monthly-model" class="feature-card card-model">
                <div class="icon">🤖</div>
                <h3 data-i18n="index.modelTitle">模型用量</h3>
                <p data-i18n="index.modelDesc">按模型维度分析用量，支持饼图占比分析</p>
                <span class="card-link"><span data-i18n="index.enter">进入</span> →</span>
            </a>
        </div>

        <div class="tech-footer">
            <span data-i18n="index.techStack">技术栈</span>
            <div class="tags">
                <span class="tag">Go</span>
                <span class="tag">Gin</span>
                <span class="tag">ECharts</span>
                <span class="tag">jQuery</span>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        function toggleLang() {
            var lang = localStorage.getItem('lang') === 'en' ? 'zh' : 'en';
            localStorage.setItem('lang', lang);
            location.reload();
        }
        function applyLang() {
            $('[data-i18n]').each(function() {
                var key = $(this).data('i18n');
                var val = key.split('.').reduce(function(o, k) { return o && o[k]; }, window.i18n);
                if (val) $(this).text(val);
            });
        }
        $(function() {
            if (localStorage.getItem('lang') === 'en') {
                var s = document.createElement('script');
                s.src = '/static/i18n/en.js';
                s.onload = function() { applyLang(); document.title = window.i18n.title.index; };
                document.head.appendChild(s);
            }
        });
    </script>
</body>
</html>
