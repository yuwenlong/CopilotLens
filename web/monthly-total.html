<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>月度总用量</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/i18n/zh.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" data-i18n="nav.home">首页</a>
        <a href="/monthly-total" data-i18n="nav.total">月度总用量</a>
        <a href="/monthly-user" data-i18n="nav.user">用户用量</a>
        <a href="/monthly-model" data-i18n="nav.model">模型用量</a>
        <a class="lang-switch" onclick="toggleLang()"><span class="lang-zh">中</span> | <span class="lang-en">EN</span></a>
    </nav>
    <div class="container">
        <h1 data-i18n="title.total">月度总用量</h1>
        <div class="filter">
            <label data-i18n="common.selectMonth">选择月份：</label>
            <input type="month" id="monthPicker">
        </div>
        <div id="resultBox" style="display:none;">
            <div class="hero-card">
                <div class="month-badge"><span class="month-icon">📅</span><span id="heroMonth"></span></div>
                <div class="big-number" id="animatedNumber">0.00</div>
                <div class="subtitle" data-i18n="common.creditsConsumed">本月 AI Credits 消耗量</div>
                <div class="unit">AI Credits</div>
            </div>
            <div id="dailyDetail" style="display:none;margin-top:24px;">
                <h3 data-i18n="total.dailyDetail" style="color:#2c3e50;margin-bottom:10px;">每日明细</h3>
                <table class="daily-table">
                    <thead>
                        <tr>
                            <th data-i18n="total.thDate">日期</th>
                            <th data-i18n="total.thCredits">AI Credits</th>
                        </tr>
                    </thead>
                    <tbody id="dailyTableBody"></tbody>
                </table>
            </div>
        </div>
        <p id="noData" style="display:none;color:#999;" data-i18n="common.noData">暂无数据</p>
    </div>
    <script>
        function animateNumber(el, target) {
            var duration = 1500;
            var start = performance.now();
            function update(now) {
                var elapsed = now - start;
                var progress = Math.min(elapsed / duration, 1);
                var ease = 1 - Math.pow(1 - progress, 4);
                var current = target * ease;
                el.textContent = current.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        function loadMonthlyTotal(month) {
            $.get("/api/monthly-total", {month: month}, function(data) {
                var t = window.i18n;
                $("#heroMonth").text(data.month);
                $("#resultBox").show();
                $("#noData").hide();
                animateNumber(document.getElementById('animatedNumber'), data.total);

                if (data.daily && data.daily.length > 0) {
                    var html = "";
                    html += "<tr class='total-row'>";
                    html += "<td>" + t.total.monthTotal + "</td>";
                    html += "<td class='credits'>" + data.total.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) + "</td>";
                    html += "</tr>";
                    data.daily.forEach(function(d) {
                        html += "<tr>";
                        html += "<td>" + d.date + "</td>";
                        html += "<td class='credits'>" + d.total.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) + "</td>";
                        html += "</tr>";
                    });
                    $("#dailyTableBody").html(html);
                    $("#dailyDetail").show();
                } else {
                    $("#dailyDetail").hide();
                }
            }).fail(function() {
                $("#resultBox").hide();
                $("#noData").show();
            });
        }

        function toggleLang() {
            var lang = localStorage.getItem('lang') === 'en' ? 'zh' : 'en';
            localStorage.setItem('lang', lang);
            location.reload();
        }
        function applyLang() {
            $('[data-i18n]').each(function() {
                var key = $(this).data('i18n');
                var val = key.split('.').reduce(function(o, k) { return o && o[k]; }, window.i18n);
                if (val) $(this).text(val);
            });
        }
        function updateLangSwitch() {
            var isEn = localStorage.getItem('lang') === 'en';
            $('.lang-zh').toggleClass('lang-active', !isEn).toggleClass('lang-inactive', isEn);
            $('.lang-en').toggleClass('lang-active', isEn).toggleClass('lang-inactive', !isEn);
        }

        $(function() {
            updateLangSwitch();
            if (localStorage.getItem('lang') === 'en') {
                var s = document.createElement('script');
                s.src = '/static/i18n/en.js';
                s.onload = function() { applyLang(); document.title = window.i18n.title.total; };
                document.head.appendChild(s);
            } else {
                document.title = window.i18n.title.total;
            }

            var params = new URLSearchParams(window.location.search);
            var month = params.get('month');
            if (month) {
                $('#monthPicker').val(month);
                loadMonthlyTotal(month);
            }
            $('#monthPicker').on('change', function() {
                if (this.value) {
                    loadMonthlyTotal(this.value);
                    history.replaceState(null, '', '?month=' + this.value);
                }
            });
        });
    </script>
</body>
</html>
